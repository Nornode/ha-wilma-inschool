---
blueprint:
  name: AI summary for entity text
  description: >-
    Watches one source entity, optionally reads a text attribute from it,
    sends the combined text to a conversation agent, and stores the reply in
    the Wilma integration via wilma.store_summary. The stored summary appears
    as a sensor whose summary attribute holds the full text, ready for a
    Markdown card. No input_text helpers are needed.
  domain: automation
  input:
    source_entity:
      name: Source entity
      description: The entity that contains the text to summarise.
      selector:
        entity: {}

    source_attribute:
      name: Source attribute
      description: >-
        Optional. For example content_markdown. Leave empty to use only the
        entity state.
      default: ""
      selector:
        text: {}

    summary_key:
      name: Summary key
      description: >-
        Identifier for this summary. It names the resulting sensor, so
        latest_message becomes sensor.wilma_<student>_summary_latest_message.
      default: latest_message
      selector:
        text: {}

    student:
      name: Student
      description: >-
        Student name or Wilma id. Leave empty when only one student is
        configured.
      default: ""
      selector:
        text: {}

    instructions:
      name: AI instructions
      description: >-
        Free-text prompt sent before the source text. There is no storage
        limit on the reply, so ask for whatever length and shape you want.
      default: >-
        Sammanfatta texten på lätt svenska i naturligt flytande språk. Lyft fram
        datum, tider och sådant som kräver en åtgärd av vårdnadshavaren. Svara i
        ren text utan markdown: inga rubriker (#), ingen fetstil (**), inga
        avdelare (---) och inga kodblock. Skriv korta stycken och använd vanliga
        bindestreck (-) för listor. Inled inte med artighetsfraser.
      selector:
        text:
          multiline: true

    format_rules:
      name: Output formatting rules
      description: >-
        Formatting instructions to ensure clear readability on phones without markdown glitches.
      default: >-
        VIKTIGT OM FORMATET:
        Svara ENDAST med ren oformaterad text.
        Använd INTE markdown: inga rubriker (#), ingen fetstil (**), ingen kursiv stil (*), inga tabeller och inga horisontella linjer (---).
        Använd korta stycken med en tom rad emellan.
        Listor skrivs med vanliga streck (-).
        Skriv datum i formatet "ons 19.11".
        Börja direkt med informationen utan inledande hälsning eller förklarande ingress.
      selector:
        text:
          multiline: true

    min_length:
      name: Minimum length before summarising
      description: >-
        Source texts shorter than this are not sent to the agent, since a short
        message is already readable as-is.
      default: 500
      selector:
        number:
          min: 0
          max: 10000
          step: 50
          unit_of_measurement: characters
          mode: box

    short_text_passthrough:
      name: Store short texts unchanged
      description: >-
        When the source is below the minimum length, store the original text as
        the summary so the dashboard card is never empty.
      default: true
      selector:
        boolean: {}

    language:
      name: Language
      default: sv
      selector:
        text: {}

    agent_id:
      name: Conversation agent
      description: For example conversation.google_ai_conversation
      default: conversation.google_ai_conversation
      selector:
        text: {}

variables:
  source_entity: !input source_entity
  source_attribute: !input source_attribute
  summary_key: !input summary_key
  student: !input student
  instructions: !input instructions
  format_rules: !input format_rules
  language: !input language
  agent_id: !input agent_id
  min_length: !input min_length
  short_text_passthrough: !input short_text_passthrough

triggers:
  - trigger: homeassistant
    event: start

  - trigger: state
    entity_id: !input source_entity

actions:
  # On HA restart, wait briefly so integration entities restore before checking status
  - if:
      - condition: template
        value_template: "{{ trigger.platform == 'homeassistant' }}"
    then:
      - delay: "00:00:15"
      - condition: template
        value_template: "{{ states(source_entity) not in ['unavailable', 'unknown', ''] }}"

  # The integration composes the source text and decides whether a call is worth it.
  - action: wilma.summary_status
    data:
      key: "{{ summary_key }}"
      student: "{{ student }}"
      source_entity: "{{ source_entity }}"
      source_attribute: "{{ source_attribute }}"
      min_length: "{{ min_length }}"
    response_variable: status

  - condition: template
    value_template: "{{ status.needs_update }}"

  - variables:
      source_text: "{{ status.source_text }}"
      source_id: >-
        {{ state_attr(source_entity, 'id') or state_attr(source_entity, 'news_id') or '' }}
      title: "{{ state_attr(source_entity, 'subject') or states(source_entity) }}"
      web_url: "{{ status.web_url or state_attr(source_entity, 'web_url') or '' }}"

  - if:
      - condition: template
        value_template: "{{ not status.call_agent }}"
    then:
      - condition: template
        value_template: "{{ short_text_passthrough }}"
      - action: wilma.store_summary
        data:
          key: "{{ summary_key }}"
          summary: "{{ source_text }}"
          student: "{{ student }}"
          title: "{{ title }}"
          source_entity: "{{ source_entity }}"
          source_attribute: "{{ source_attribute }}"
          source_id: "{{ source_id }}"
          source_text: "{{ source_text }}"
          web_url: "{{ web_url }}"
          generated_by: passthrough
    else:
      - variables:
          prompt_text: >-
            {{ instructions }}

            {{ format_rules }}

            Källtext:

            {{ source_text }}

      - action: conversation.process
        continue_on_error: true
        data:
          language: "{{ language }}"
          agent_id: "{{ agent_id }}"
          text: "{{ prompt_text }}"
        response_variable: agent_response

      - variables:
          summary_text: >-
            {% if agent_response is defined %}
            {{
              agent_response.get('response', {}).get('speech', {}).get('plain', {}).get('speech', '')
              | trim
            }}
            {% else %}
            {{ '' }}
            {% endif %}

      # A failed or empty reply is recorded instead of overwriting a good summary.
      - if:
          - condition: template
            value_template: "{{ summary_text | trim == '' }}"
        then:
          - action: wilma.store_summary_error
            data:
              key: "{{ summary_key }}"
              student: "{{ student }}"
              error: >-
                {% if agent_response is not defined %}
                Agenten {{ agent_id }} svarade inte.
                {% else %}
                Agenten {{ agent_id }} gav ett tomt svar.
                {% endif %}
          - stop: "Conversation agent returned no usable summary"

      - action: wilma.store_summary
        data:
          key: "{{ summary_key }}"
          summary: "{{ summary_text }}"
          student: "{{ student }}"
          title: "{{ title }}"
          prompt: "{{ prompt_text }}"
          instructions: "{{ instructions }}"
          source_entity: "{{ source_entity }}"
          source_attribute: "{{ source_attribute }}"
          source_id: "{{ source_id }}"
          source_text: "{{ source_text }}"
          web_url: "{{ web_url }}"
          agent_id: "{{ agent_id }}"
          generated_by: agent

mode: restart
max_exceeded: silent
