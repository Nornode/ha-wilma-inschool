---
blueprint:
  name: AI summary for latest bulletin
  description: >-
    Watches one latest_bulletin entity, sends content_markdown to a
    conversation agent, and stores the summary across three text entities.
  domain: automation
  input:
    source_entity:
      name: Bulletin source entity
      description: Choose a Wilma latest_bulletin entity.
      selector:
        entity:
          domain: sensor

    llm_instructions:
      name: LLM instructions
      description: >-
        Editable prompt instructions added before the source content.
      default: >-
        If the text is longer than 500 characters, return a concise and readable
        summary. Keep the summary under 500 characters.
      selector:
        text:
          multiline: true

    language:
      name: Language
      default: en
      selector:
        text: {}

    agent_id:
      name: Conversation agent
      description: For example conversation.google_ai_conversation
      default: conversation.home_assistant
      selector:
        text: {}

    summary_part_1:
      name: Bulletin summary part 1
      description: First text entity used to store the summary.
      selector:
        entity:
          filter:
            - domain: input_text
            - domain: text

    summary_part_2:
      name: Bulletin summary part 2
      description: Second text entity used to store the summary.
      selector:
        entity:
          filter:
            - domain: input_text
            - domain: text

    summary_part_3:
      name: Bulletin summary part 3
      description: Third text entity used to store the summary.
      selector:
        entity:
          filter:
            - domain: input_text
            - domain: text

variables:
  source_entity: !input source_entity
  llm_instructions: !input llm_instructions
  language: !input language
  agent_id: !input agent_id
  summary_part_1: !input summary_part_1
  summary_part_2: !input summary_part_2
  summary_part_3: !input summary_part_3

triggers:
  - trigger: state
    entity_id: !input source_entity

conditions:
  - condition: template
    value_template: >-
      {% set new = trigger.to_state %}
      {% set old = trigger.from_state %}
      {% set bad_states = ['unknown', 'unavailable', 'none', 'None', ''] %}
      {% set new_content = new.attributes.content_markdown | default('', true) if new else '' %}
      {% set old_content = old.attributes.content_markdown | default('', true) if old else '' %}
      {{
        new is not none
        and new.state not in bad_states
        and new_content | trim != ''
        and new_content != old_content
      }}

actions:
  - variables:
      wilma_subject: >-
        {{
          trigger.to_state.attributes.subject
          | default(trigger.to_state.state, true)
        }}
      wilma_content: >-
        {{
          trigger.to_state.attributes.content_markdown
          | default('', true)
          | trim
        }}

  - action: conversation.process
    data:
      language: "{{ language }}"
      agent_id: "{{ agent_id }}"
      text: >-
        {{ llm_instructions }}

        Subject: {{ wilma_subject }}

        Text:
        {{ wilma_content }}
    response_variable: agent_response

  - variables:
      summary_text: >-
        {{
          agent_response.get('response', {}).get('speech', {}).get('plain', {}).get('speech', '')
          | trim
        }}
      summary_text_part_1: "{{ summary_text[0:255] }}"
      summary_text_part_2: "{{ summary_text[255:510] }}"
      summary_text_part_3: "{{ summary_text[510:765] }}"

  - condition: template
    value_template: "{{ summary_text != '' }}"

  - action: >-
      {{
        'input_text.set_value'
        if summary_part_1.split('.')[0] == 'input_text'
        else 'text.set_value'
      }}
    target:
      entity_id: !input summary_part_1
    data:
      value: "{{ summary_text_part_1 }}"

  - action: >-
      {{
        'input_text.set_value'
        if summary_part_2.split('.')[0] == 'input_text'
        else 'text.set_value'
      }}
    target:
      entity_id: !input summary_part_2
    data:
      value: "{{ summary_text_part_2 }}"

  - action: >-
      {{
        'input_text.set_value'
        if summary_part_3.split('.')[0] == 'input_text'
        else 'text.set_value'
      }}
    target:
      entity_id: !input summary_part_3
    data:
      value: "{{ summary_text_part_3 }}"

  - action: homeassistant.update_entity
    target:
      entity_id: !input summary_part_1

mode: restart
max_exceeded: silent
