---
blueprint:
  name: AI summary for latest attendance mark
  description: >-
    Watches one latest_attendance entity, builds a compact attendance text
    payload from attributes, sends it to a conversation agent, and stores the
    summary across three text entities.
  domain: automation
  input:
    source_entity:
      name: Attendance source entity
      description: Choose a Wilma latest_attendance entity.
      selector:
        entity:
          domain: sensor

    llm_instructions:
      name: LLM instructions
      description: >-
        Editable prompt instructions added before the source content.
      default: >-
        Summarize this attendance update in a concise and readable way.
        Keep the summary under 500 characters.
      selector:
        text:
          multiline: true

    language:
      name: Language
      default: en
      selector:
        text: {}

    agent_id:
      name: Conversation agent
      description: For example conversation.google_ai_conversation
      default: conversation.home_assistant
      selector:
        text: {}

    summary_part_1:
      name: Attendance summary part 1
      description: First text entity used to store the summary.
      selector:
        entity:
          filter:
            - domain: input_text
            - domain: text

    summary_part_2:
      name: Attendance summary part 2
      description: Second text entity used to store the summary.
      selector:
        entity:
          filter:
            - domain: input_text
            - domain: text

    summary_part_3:
      name: Attendance summary part 3
      description: Third text entity used to store the summary.
      selector:
        entity:
          filter:
            - domain: input_text
            - domain: text

variables:
  source_entity: !input source_entity
  llm_instructions: !input llm_instructions
  language: !input language
  agent_id: !input agent_id
  summary_part_1: !input summary_part_1
  summary_part_2: !input summary_part_2
  summary_part_3: !input summary_part_3

triggers:
  - trigger: state
    entity_id: !input source_entity

conditions:
  - condition: template
    value_template: >-
      {% set new = trigger.to_state %}
      {% set old = trigger.from_state %}
      {% set bad_states = ['unknown', 'unavailable', 'none', 'None', ''] %}
      {{
        new is not none
        and new.state not in bad_states
        and (old is none or new.state != old.state or new.attributes != old.attributes)
      }}

actions:
  - variables:
      attendance_mark_type: "{{ trigger.to_state.attributes.mark_type | default(trigger.to_state.state, true) }}"
      attendance_date: "{{ trigger.to_state.attributes.date | default('', true) }}"
      attendance_lesson_hour: "{{ trigger.to_state.attributes.lesson_hour | default('', true) }}"
      attendance_subject_code: "{{ trigger.to_state.attributes.subject_code | default('', true) }}"
      attendance_teacher: "{{ trigger.to_state.attributes.teacher | default('', true) }}"
      attendance_note: "{{ trigger.to_state.attributes.note | default('', true) }}"
      attendance_text: >-
        Mark type: {{ attendance_mark_type }}
        Date: {{ attendance_date }}
        Lesson hour: {{ attendance_lesson_hour }}
        Subject code: {{ attendance_subject_code }}
        Teacher: {{ attendance_teacher }}
        Note: {{ attendance_note }}

  - action: conversation.process
    data:
      language: "{{ language }}"
      agent_id: "{{ agent_id }}"
      text: >-
        {{ llm_instructions }}

        Attendance update:
        {{ attendance_text }}
    response_variable: agent_response

  - variables:
      summary_text: >-
        {{
          agent_response.get('response', {}).get('speech', {}).get('plain', {}).get('speech', '')
          | trim
        }}
      summary_text_part_1: "{{ summary_text[0:255] }}"
      summary_text_part_2: "{{ summary_text[255:510] }}"
      summary_text_part_3: "{{ summary_text[510:765] }}"

  - condition: template
    value_template: "{{ summary_text != '' }}"

  - action: >-
      {{
        'input_text.set_value'
        if summary_part_1.split('.')[0] == 'input_text'
        else 'text.set_value'
      }}
    target:
      entity_id: !input summary_part_1
    data:
      value: "{{ summary_text_part_1 }}"

  - action: >-
      {{
        'input_text.set_value'
        if summary_part_2.split('.')[0] == 'input_text'
        else 'text.set_value'
      }}
    target:
      entity_id: !input summary_part_2
    data:
      value: "{{ summary_text_part_2 }}"

  - action: >-
      {{
        'input_text.set_value'
        if summary_part_3.split('.')[0] == 'input_text'
        else 'text.set_value'
      }}
    target:
      entity_id: !input summary_part_3
    data:
      value: "{{ summary_text_part_3 }}"

  - action: homeassistant.update_entity
    target:
      entity_id: !input summary_part_1

mode: restart
max_exceeded: silent
