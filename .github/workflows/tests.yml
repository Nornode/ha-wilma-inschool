name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
      - name: Ruff
        run: ruff check . || true
      - name: Mypy
        run: mypy custom_components/wilma || true # allow soft-fail until types stabilise
      - name: Pytest
        run: pytest --cov=custom_components/wilma --cov-report=term-missing
