refresh:
  name: Refresh
  description: Force a refresh of Wilma data.
  target:
    entity:
      domain: sensor
      integration: wilma

store_summary:
  name: Store summary
  description: >-
    Store an AI-generated (or hand-written) summary for a student. The
    integration only persists the text and its metadata; it never calls a
    conversation agent itself.
  fields:
    key:
      name: Summary key
      description: >-
        Identifier for this summary, used to name the resulting sensor. For
        example latest_message or daily_digest.
      required: true
      example: latest_message
      selector:
        text:
    summary:
      name: Summary text
      description: The full summary text. There is no length limit.
      required: true
      selector:
        text:
          multiline: true
    student:
      name: Student
      description: >-
        Student id or name. Optional when only one student is configured.
      example: Virppi
      selector:
        text:
    title:
      name: Title
      description: Short label used as the sensor state.
      selector:
        text:
    prompt:
      name: Prompt
      description: The full prompt that was sent to the conversation agent.
      selector:
        text:
          multiline: true
    instructions:
      name: Instructions
      description: The instruction block only, without the source text.
      selector:
        text:
          multiline: true
    source_entity:
      name: Source entity
      description: The entity whose text was summarised.
      selector:
        text:
    source_attribute:
      name: Source attribute
      description: >-
        Attribute of the source entity that was summarised, for example
        content_markdown. Stored so staleness can be detected later.
      selector:
        text:
    source_id:
      name: Source id
      description: Message or bulletin id the summary was generated from.
      selector:
        text:
    source_text:
      name: Source text
      description: >-
        The text that was summarised. Only a short hash is stored, so a later
        run can tell whether the source changed. Composed from the source
        entity and attribute when omitted.
      selector:
        text:
          multiline: true
    agent_id:
      name: Conversation agent
      description: The conversation agent that produced the summary.
      selector:
        text:
    generated_by:
      name: Generated by
      description: >-
        agent when a conversation agent wrote the summary, passthrough when the
        original text was stored unchanged.
      selector:
        select:
          options:
            - agent
            - passthrough
    entry_id:
      name: Config entry id
      description: Required only when several Wilma accounts are configured.
      selector:
        text:

summary_status:
  name: Summary status
  description: >-
    Report whether a summary needs regenerating, without calling any
    conversation agent. Returns the composed source text so an automation can
    decide before spending tokens.
  fields:
    key:
      name: Summary key
      description: The summary key to check.
      required: true
      example: latest_message
      selector:
        text:
    source_entity:
      name: Source entity
      description: The entity holding the text to summarise.
      required: true
      selector:
        text:
    source_attribute:
      name: Source attribute
      description: Optional attribute to read instead of, or in addition to, the state.
      selector:
        text:
    min_length:
      name: Minimum length
      description: >-
        Source texts shorter than this do not need a conversation agent.
      default: 500
      selector:
        number:
          min: 0
          max: 10000
          step: 50
          unit_of_measurement: characters
          mode: box
    student:
      name: Student
      description: Student id or name. Optional with a single student.
      selector:
        text:
    entry_id:
      name: Config entry id
      description: Required only when several Wilma accounts are configured.
      selector:
        text:

clear_summary:
  name: Clear summary
  description: Remove stored summaries.
  fields:
    key:
      name: Summary key
      description: Omit to clear every summary key.
      selector:
        text:
    student:
      name: Student
      description: Omit to clear the key for every student.
      selector:
        text:
    entry_id:
      name: Config entry id
      description: Required only when several Wilma accounts are configured.
      selector:
        text:

store_summary_error:
  name: Store summary error
  description: >-
    Record a failed summary attempt. Any previously stored summary is kept, so
    a temporary agent outage does not blank the dashboard.
  fields:
    key:
      name: Summary key
      description: The summary key that failed.
      required: true
      example: latest_message
      selector:
        text:
    error:
      name: Error
      description: Message shown on the summary sensor.
      required: true
      selector:
        text:
    student:
      name: Student
      description: Student id or name. Optional with a single student.
      selector:
        text:
    entry_id:
      name: Config entry id
      description: Required only when several Wilma accounts are configured.
      selector:
        text:
